name: Build APK Manual

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Sürüm örn: 1.0.0-beta.3.6.1"
        required: true
        default: "1.0.0-beta.3.6.1"

jobs:
  build:
    name: Build LoganOS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate version_name input
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${{ inputs.version_name }}"
          if ! [[ "$VERSION_NAME" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$ ]]; then
            echo "::error::Güvensiz/uygunsuz version_name: $VERSION_NAME"
            exit 1
          fi

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          # Not: cache: gradle burada kasıtlı olarak KULLANILMIYOR.
          # Proje ZIP içinden geliyorsa bu adımda henüz hiçbir gradle
          # dosyası checkout'ta bulunmaz ve setup-java "No file matched" ile patlar.
          # Gradle bağımlılık/derleme cache'i zaten gradle/actions/setup-gradle
          # tarafından, Gradle fiilen çalıştığında devreye giriyor.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare source
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find . -maxdepth 2 -type f | sort

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "Gradle project found at repository root."
            echo "gradle_root=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No Gradle project and no ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found inside ZIP."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          GRADLE_ROOT=$(dirname "$SETTINGS_FILE")
          echo "Gradle project found at: $GRADLE_ROOT"
          echo "gradle_root=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"

      - name: Pick build command (wrapper varsa onu kullan)
        id: gradlecmd
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.prep.outputs.gradle_root }}"
          if [ -x "$ROOT/gradlew" ]; then
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::gradlew bulunamadı, sistemdeki 'gradle' (8.10.2) kullanılacak."
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          cd "${{ steps.prep.outputs.gradle_root }}"

          mkdir -p "$GITHUB_WORKSPACE/build-report"

          echo "LoganOS APK Build Report" > "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"
          echo "========================================" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"
          echo "Version: ${{ inputs.version_name }}" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"
          echo "Workflow: ${{ github.workflow }}" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"
          echo "Run: ${{ github.run_number }}" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"
          echo "" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"

          ${{ steps.gradlecmd.outputs.cmd }} assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-report/gradle-full.log"

          BUILD_EXIT=${PIPESTATUS[0]}

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "BUILD RESULT: FAIL" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"
            echo "" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"

            echo "===== COMPILATION ERRORS =====" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"

            grep -E \
              '(^e: |^[^ ]+\.kt:[0-9]+:[0-9]+|Execution failed|What went wrong|FAILURE: Build failed)' \
              "$GITHUB_WORKSPACE/build-report/gradle-full.log" \
              >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt" || true

            echo "" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"
            echo "===== FULL GRADLE LOG =====" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"

            cat "$GITHUB_WORKSPACE/build-report/gradle-full.log" \
              >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"

            exit "$BUILD_EXIT"
          fi

          echo "BUILD RESULT: PASS" >> "$GITHUB_WORKSPACE/build-report/loganos-build-error.txt"

      - name: Upload build error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoganOS-build-report-${{ github.run_number }}
          path: build-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "LoganOS APK build failed."
          echo "Download the 'LoganOS-build-report-${{ github.run_number }}' artifact."
          exit 1

      - name: Rename APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp \
            "${{ steps.prep.outputs.gradle_root }}/app/build/outputs/apk/debug/app-debug.apk" \
            "dist/LoganOS-v${{ inputs.version_name }}-debug.apk"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LoganOS-v${{ inputs.version_name }}-apk
          path: dist/LoganOS-v${{ inputs.version_name }}-debug.apk
