name: Publish Secure LoganOS Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Sürüm notları
        required: true
        type: string
      confirm:
        description: Yayınlamak için tam olarak PUBLISH yaz
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: loganos-production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish signed APK
    if: inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Bu environment GitHub Settings > Environments altında oluşturulmalı.
    # İmzalama secret'ları yalnız burada tutulmalı ve mümkünse Required reviewers açılmalı.
    environment: release-signing

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          # Not: cache: gradle burada kasıtlı olarak KULLANILMIYOR.
          # Proje ZIP içinden geliyorsa bu adımda henüz hiçbir gradle
          # dosyası checkout'ta bulunmaz ve setup-java "No file matched" ile patlar.
          # Gradle bağımlılık/derleme cache'i zaten gradle/actions/setup-gradle
          # tarafından, Gradle fiilen çalıştığında devreye giriyor.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare source
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "gradle_root=." >> "$GITHUB_OUTPUT"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | sort -V | tail -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Gradle projesi bulunamadı ve kaynak ZIP de yok."
              exit 1
            fi

            rm -rf extracted
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
            SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::ZIP içinde settings.gradle(.kts) bulunamadı."
              exit 1
            fi
            echo "gradle_root=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick build command (wrapper varsa onu kullan)
        id: gradlecmd
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.prep.outputs.gradle_root }}"
          if [ -x "$ROOT/gradlew" ]; then
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::gradlew bulunamadı, sistemdeki 'gradle' (8.10.2) kullanılacak. Proje farklı bir Gradle sürümü bekliyorsa build başarısız olabilir."
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LOGANOS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LOGANOS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOGANOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LOGANOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::release-signing environment secret'ları eksik."
              exit 1
            fi
          done
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/loganos-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "LOGANOS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "LOGANOS_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LOGANOS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LOGANOS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="${{ steps.prep.outputs.gradle_root }}/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::$GRADLE_FILE bulunamadı."
            exit 1
          fi
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$GRADLE_FILE" | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' "$GRADLE_FILE" | head -n 1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Version bilgisi okunamadı."
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$ ]]; then
            echo "::error::Güvensiz versionName: $VERSION_NAME"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_TAG=${TAG//\//%2F}

          HTTP_STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ENCODED_TAG}" \
            --silent -o /dev/null -w '%{http_code}' 2>/tmp/tag_check_err.txt || true)

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "::error::Tag zaten mevcut: $TAG. Tekrar yayınlamak için app/build.gradle.kts içindeki versionName / versionCode değerlerini artırın."
            exit 1
          elif [ -n "$HTTP_STATUS" ] && [ "$HTTP_STATUS" != "404" ]; then
            echo "::error::Tag kontrolü beklenmedik şekilde başarısız oldu (HTTP $HTTP_STATUS). Ağ/izin sorunu olabilir, tekrar deneyin."
            cat /tmp/tag_check_err.txt || true
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release zaten mevcut: $TAG"
            exit 1
          fi

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.prep.outputs.gradle_root }}"
          ${{ steps.gradlecmd.outputs.cmd }} test --stacktrace

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.prep.outputs.gradle_root }}"
          mkdir -p "$GITHUB_WORKSPACE/build-report"
          if ! ${{ steps.gradlecmd.outputs.cmd }} assembleRelease --stacktrace 2>&1 \
              | tee "$GITHUB_WORKSPACE/build-report/gradle-release-full.log"; then
            echo "::error::Release build başarısız oldu, build-report artifact'ine bakın."
            exit 1
          fi

      - name: Upload release build log (yalnız hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LoganOS-release-build-log-${{ github.run_number }}
          path: build-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect APK and checksum
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE_APK="${{ steps.prep.outputs.gradle_root }}/app/build/outputs/apk/release/app-release.apk"
          TARGET_APK="dist/LoganOS-v${VERSION_NAME}-release.apk"
          test -f "$SOURCE_APK"
          cp "$SOURCE_APK" "$TARGET_APK"
          (cd dist && sha256sum "$(basename "$TARGET_APK")" > "$(basename "$TARGET_APK").sha256")

      - name: Verify APK signature and package
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/LoganOS-v${VERSION_NAME}-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "dist/LoganOS-v${VERSION_NAME}-release.certificate.txt"
          "$AAPT" dump badging "$APK" | tee "dist/LoganOS-v${VERSION_NAME}-release.badging.txt"
          grep -q "package: name='com.dcui.loganos'" "dist/LoganOS-v${VERSION_NAME}-release.badging.txt"
          grep -q "versionName='${VERSION_NAME}'" "dist/LoganOS-v${VERSION_NAME}-release.badging.txt"

      - name: Generate GitHub build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/LoganOS-v${{ steps.version.outputs.name }}-release.apk

      - name: Create immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/LoganOS-v${VERSION_NAME}-release.apk"
          SHA="${APK}.sha256"
          CERT="dist/LoganOS-v${VERSION_NAME}-release.certificate.txt"
          BADGING="dist/LoganOS-v${VERSION_NAME}-release.badging.txt"

          EXTRA_ARGS=()
          if [[ "$VERSION_NAME" == *"beta"* || "$VERSION_NAME" == *"alpha"* || "$VERSION_NAME" == *"rc"* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            "$APK" "$SHA" "$CERT" "$BADGING" \
            --target "$GITHUB_SHA" \
            --title "LoganOS v${VERSION_NAME}" \
            --notes "$RELEASE_NOTES" \
            "${EXTRA_ARGS[@]}"

          {
            echo "## LoganOS Release Yayınlandı 🎉"
            echo ""
            echo "- **Sürüm:** $VERSION_NAME"
            echo "- **Tag:** $TAG"
            echo "- **Commit:** $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: |
          rm -f "${LOGANOS_KEYSTORE_PATH:-}"
