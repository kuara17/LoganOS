name: Publish Secure LoganOS Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "İsteğe bağlı yayın notu geçersiz kılma; boş bırakılırsa kaynak ZIP içindeki yerelleştirilmiş OTA notları kullanılır."
        required: false
        type: string
        default: ""
      confirm:
        description: Yayınlamak için tam olarak PUBLISH yaz
        required: true
        type: string
      override_existing:
        description: "Mevcut GitHub Release varlıkları yeni ve doğrulanmış APK ile değiştirilsin mi?"
        required: false
        type: boolean
        default: false
      source_zip:
        description: "Gradle projesi repo kökünde değilse kullanılacak ZIP yolu (ör. releases/LoganOS-source.zip)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: loganos-production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish signed APK
    if: inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: release-signing

    steps:
      - name: Checkout exact source
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        id: gradle_setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare source
        id: prep
        shell: bash
        env:
          SOURCE_ZIP_INPUT: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/loganos-gradle-output.txt"
          mkdir -p "$(dirname "$LOG")"

          {
            echo "Preparing LoganOS source..."
            if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
              if [[ -n "$SOURCE_ZIP_INPUT" ]]; then
                echo "::error::A Gradle project exists at repository root; source_zip was supplied and would be ignored. Clear source_zip or remove the root project."
                exit 1
              fi
              echo "Gradle project found at repository root."
              echo "gradle_root=." >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ -n "$SOURCE_ZIP_INPUT" ]]; then
              ZIP_FILE="$SOURCE_ZIP_INPUT"
              if [[ ! -f "$ZIP_FILE" ]]; then
                echo "::error::Specified source ZIP does not exist: $ZIP_FILE"
                exit 1
              fi
            else
              mapfile -t ZIP_FILES < <(find . -maxdepth 2 -type f -name '*.zip' -not -path './.git/*' | sort)
              if [[ "${#ZIP_FILES[@]}" -ne 1 ]]; then
                echo "::error::Expected exactly one source ZIP when no Gradle project is at repository root; found ${#ZIP_FILES[@]}. Set the source_zip workflow input to the intended file."
                printf 'Candidate: %s\n' "${ZIP_FILES[@]}"
                exit 1
              fi
              ZIP_FILE="${ZIP_FILES[0]}"
            fi

            ZIP_REAL="$(realpath -e "$ZIP_FILE")"
            WORKSPACE_REAL="$(realpath -e "$GITHUB_WORKSPACE")"
            case "$ZIP_REAL" in
              "$WORKSPACE_REAL"/*) ;;
              *)
                echo "::error::source_zip must point to a file inside the checked-out repository."
                exit 1
                ;;
            esac

            echo "Using explicitly selected source ZIP: $ZIP_FILE"
            rm -rf extracted
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
            mapfile -t SETTINGS_FILES < <(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | sort)
            if [[ "${#SETTINGS_FILES[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one Gradle settings file inside source ZIP; found ${#SETTINGS_FILES[@]}."
              printf 'Settings file: %s\n' "${SETTINGS_FILES[@]}"
              exit 1
            fi
            GRADLE_ROOT="$(dirname "${SETTINGS_FILES[0]}")"
            echo "Gradle project found at: $GRADLE_ROOT"
            echo "gradle_root=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee -a "$LOG"

      - name: Generate checksum-pinned Gradle Wrapper
        id: wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.prep.outputs.gradle_root }}"
          gradle --no-daemon wrapper \
            --gradle-version 8.9 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab \
            2>&1 | tee -a "$RUNNER_TEMP/loganos-gradle-output.txt"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/loganos-gradle-output.txt"
          {
            GRADLE_FILE="${{ steps.prep.outputs.gradle_root }}/app/build.gradle.kts"
            if [[ ! -f "$GRADLE_FILE" ]]; then
              echo "::error::app/build.gradle.kts was not found."
              exit 1
            fi
            VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$GRADLE_FILE" | head -n 1)"
            VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' "$GRADLE_FILE" | head -n 1)"
            if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
              echo "::error::Version metadata could not be read from app/build.gradle.kts."
              exit 1
            fi
            if ! [[ "$VERSION_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Unsafe versionName in app/build.gradle.kts."
              exit 1
            fi
            echo "Detected versionName=$VERSION_NAME versionCode=$VERSION_CODE"
            echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
            echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee -a "$LOG"

      - name: Enforce production signer pin configuration
        id: signer_pin
        env:
          EXPECTED_SIGNER_SHA256: ${{ vars.LOGANOS_EXPECTED_SIGNER_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(printf '%s' "${EXPECTED_SIGNER_SHA256:-}" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$PIN" ]]; then
            echo "::error::LOGANOS_EXPECTED_SIGNER_SHA256 is required for production releases; refusing to continue."
            exit 1
          fi
          if ! [[ "$PIN" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::LOGANOS_EXPECTED_SIGNER_SHA256 must be a 64-character SHA-256 fingerprint (colons are optional)."
            exit 1
          fi
          echo "Production signer pin is configured and has a valid SHA-256 format."

      - name: Validate release signing secrets and materialize keystore
        id: signing
        shell: bash
        env:
          LOGANOS_KEYSTORE_BASE64: ${{ secrets.LOGANOS_KEYSTORE_BASE64 }}
          LOGANOS_STORE_PASSWORD: ${{ secrets.LOGANOS_STORE_PASSWORD }}
          LOGANOS_KEY_ALIAS: ${{ secrets.LOGANOS_KEY_ALIAS }}
          LOGANOS_KEY_PASSWORD: ${{ secrets.LOGANOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/loganos-gradle-output.txt"
          for name in LOGANOS_KEYSTORE_BASE64 LOGANOS_STORE_PASSWORD LOGANOS_KEY_ALIAS LOGANOS_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              message="Missing required GitHub environment secret: ${name}"
              echo "::error::$message" >&2
              printf '%s\n' "$message" | tee -a "$LOG" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/loganos-release.jks"
          if ! printf '%s' "$LOGANOS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::LOGANOS_KEYSTORE_BASE64 could not be decoded."
            printf '%s\n' "LOGANOS_KEYSTORE_BASE64 could not be decoded." | tee -a "$LOG" >&2
            exit 1
          fi
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded release keystore is empty."
            printf '%s\n' "Decoded release keystore is empty." | tee -a "$LOG" >&2
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          echo "LOGANOS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        id: build
        shell: bash
        env:
          LOGANOS_STORE_PASSWORD: ${{ secrets.LOGANOS_STORE_PASSWORD }}
          LOGANOS_KEY_ALIAS: ${{ secrets.LOGANOS_KEY_ALIAS }}
          LOGANOS_KEY_PASSWORD: ${{ secrets.LOGANOS_KEY_PASSWORD }}
          LOGANOS_UPDATE_REPOSITORY: ${{ vars.LOGANOS_UPDATE_REPOSITORY || github.repository }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${LOGANOS_KEYSTORE_PATH:-}"
          cleanup_keystore() { [[ -z "$KEYSTORE_PATH" ]] || rm -f -- "$KEYSTORE_PATH"; }
          trap cleanup_keystore EXIT
          trap 'cleanup_keystore; exit 130' INT
          trap 'cleanup_keystore; exit 143' TERM
          LOG="$RUNNER_TEMP/loganos-gradle-output.txt"
          {
            REPOSITORY_VALUE="$(printf '%s' "${LOGANOS_UPDATE_REPOSITORY:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            if ! [[ "$REPOSITORY_VALUE" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::LOGANOS_UPDATE_REPOSITORY must match owner/repo (received an invalid or blank value)."
              exit 1
            fi
            export LOGANOS_UPDATE_REPOSITORY="$REPOSITORY_VALUE"
            echo "Using validated update repository: $LOGANOS_UPDATE_REPOSITORY"
            cd "${{ steps.prep.outputs.gradle_root }}"
            ./gradlew --no-daemon :app:assembleRelease --stacktrace
            cleanup_keystore
            KEYSTORE_PATH=""
            echo "Temporary signing keystore removed immediately after successful build."
          } 2>&1 | tee -a "$LOG"

      - name: Collect APK and checksum
        id: collect
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/loganos-gradle-output.txt"
          {
            mkdir -p dist
            mapfile -t APK_FILES < <(find "${{ steps.prep.outputs.gradle_root }}/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | sort)
            if [[ "${#APK_FILES[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one release APK; found ${#APK_FILES[@]}."
              exit 1
            fi
            SOURCE_APK="${APK_FILES[0]}"
            TARGET_NAME="LoganOS-v${VERSION_NAME}-release.apk"
            TARGET_APK="dist/$TARGET_NAME"
            cp "$SOURCE_APK" "$TARGET_APK"
            (cd dist && sha256sum "$TARGET_NAME" > "$TARGET_NAME.sha256")
            echo "Collected APK: $TARGET_APK"
            echo "apk=$TARGET_APK" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee -a "$LOG"

      - name: Verify APK signature, package and version
        id: verify
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          EXPECTED_SIGNER_SHA256: ${{ vars.LOGANOS_EXPECTED_SIGNER_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/loganos-gradle-output.txt"
          {
            APK="dist/LoganOS-v${VERSION_NAME}-release.apk"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
            if [[ -z "$APKSIGNER" || -z "$AAPT" ]]; then
              echo "::error::Android build-tools apksigner or aapt was not found."
              exit 1
            fi
            CERT_FILE="dist/LoganOS-v${VERSION_NAME}-release.certificate.txt"
            "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$CERT_FILE"
            "$AAPT" dump badging "$APK" > "dist/LoganOS-v${VERSION_NAME}-release.badging.txt"
            BADGING="dist/LoganOS-v${VERSION_NAME}-release.badging.txt"
            grep -Fq "package: name='com.dcui.loganos'" "$BADGING"
            grep -Fq "versionCode='${VERSION_CODE}'" "$BADGING"
            grep -Fq "versionName='${VERSION_NAME}'" "$BADGING"
            if ! grep -Fq "sdkVersion:'26'" "$BADGING"; then
              echo "::error::APK minSdk must be 26 (sdkVersion:'26')."
              exit 1
            fi
            if ! grep -Fq "targetSdkVersion:'35'" "$BADGING"; then
              echo "::error::APK targetSdk must be 35 (targetSdkVersion:'35')."
              exit 1
            fi

            EXPECTED="$(printf '%s' "${EXPECTED_SIGNER_SHA256:-}" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if ! [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::LOGANOS_EXPECTED_SIGNER_SHA256 is missing or invalid; refusing to publish."
              exit 1
            fi
            ACTUAL="$(sed -nE -e 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' -e 's/^V[0-9]+([.][0-9]+)? Signer: certificate SHA-256 digest:[[:space:]]*//p' "$CERT_FILE" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::APK signer certificate fingerprint does not match LOGANOS_EXPECTED_SIGNER_SHA256."
              exit 1
            fi
            echo "Production signer SHA-256 fingerprint matches the configured pin."
            echo "APK signature, package id, versionName and versionCode verified."
          } 2>&1 | tee -a "$LOG"

      - name: Generate GitHub build provenance attestation
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/LoganOS-v${{ steps.version.outputs.name }}-release.apk

      - name: Publish verified release assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
          GRADLE_ROOT: ${{ steps.prep.outputs.gradle_root }}
          OVERRIDE_EXISTING: ${{ inputs.override_existing }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/loganos-gradle-output.txt"
          {
          RELEASE_NOTES="$RELEASE_NOTES_INPUT"
          if [[ -z "$RELEASE_NOTES" ]]; then
            NOTES_DIR="$GRADLE_ROOT/docs"
            mapfile -t NOTES_FILES < <(find "$NOTES_DIR" -maxdepth 1 -type f -name 'OTA_RELEASE_NOTES*.md' -print | sort)
            if [[ "${#NOTES_FILES[@]}" -ne 1 ]]; then
              echo "::error::Leave release_notes blank only when exactly one docs/OTA_RELEASE_NOTES*.md file exists; found ${#NOTES_FILES[@]}."
              exit 1
            fi
            NOTES_FILE="${NOTES_FILES[0]}"
            if grep -Fq 'LOGANOS_NOTES_' "$NOTES_FILE"; then
              # A localized notes file must contain exactly one complete, ordered pair
              # of TR and EN sections. Reject malformed files before extracting/publishing.
              if ! python3 - "$NOTES_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          token_re = re.compile(
              r"<!--\\s*LOGANOS_NOTES_(TR|EN)_(START|END)\\s*-->",
              re.IGNORECASE,
          )
          matches = list(token_re.finditer(text))
          found = [(m.group(1).upper(), m.group(2).upper()) for m in matches]
          expected = [("TR", "START"), ("TR", "END"), ("EN", "START"), ("EN", "END")]
          if found != expected:
              print(
                  "::error::Localized release notes must contain exactly one ordered "
                  "TR_START, TR_END, EN_START, EN_END marker sequence.",
                  file=sys.stderr,
              )
              sys.exit(1)

          for language, start_marker, end_marker in (
              ("TR", matches[0], matches[1]),
              ("EN", matches[2], matches[3]),
          ):
              if not text[start_marker.end():end_marker.start()].strip():
                  print(
                      f"::error::Localized {language} release-note section is empty.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          PY
              then
                echo "::error::Localized release-note marker validation failed for $NOTES_FILE."
                exit 1
              fi

              EXTRACTED_NOTES="$RUNNER_TEMP/loganos-release-notes.md"
              if ! awk '
                /<!-- LOGANOS_NOTES_TR_START -->/ { copying=1 }
                copying { print }
                /<!-- LOGANOS_NOTES_EN_END -->/ { found_end=1; exit }
                END { if (!copying || !found_end) exit 1 }
              ' "$NOTES_FILE" > "$EXTRACTED_NOTES"; then
                echo "::error::Localized release-note extraction failed for $NOTES_FILE."
                exit 1
              fi
              RELEASE_NOTES="$(cat "$EXTRACTED_NOTES")"
            else
              RELEASE_NOTES="$(cat "$NOTES_FILE")"
            fi
            echo "Using release notes from source: $NOTES_FILE"
          else
            echo "Using explicitly supplied release_notes workflow input."
          fi
          if [[ -z "$RELEASE_NOTES" ]]; then
            echo "::error::Release notes are empty; refusing to publish."
            exit 1
          fi
          APK="dist/LoganOS-v${VERSION_NAME}-release.apk"
          SHA="${APK}.sha256"
          CERT="dist/LoganOS-v${VERSION_NAME}-release.certificate.txt"
          BADGING="dist/LoganOS-v${VERSION_NAME}-release.badging.txt"
          EXTRA_ARGS=()
          if [[ "$VERSION_NAME" == *"beta"* || "$VERSION_NAME" == *"alpha"* || "$VERSION_NAME" == *"rc"* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          TAG_EXISTS=false
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          RELEASE_EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          if [[ "$TAG_EXISTS" == "true" && "$RELEASE_EXISTS" == "false" ]]; then
            echo "::error::Tag $TAG already exists without a GitHub Release. Refusing to move or delete the existing tag."
            exit 1
          fi

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            if [[ "$OVERRIDE_EXISTING" != "true" ]]; then
              echo "::error::Release $TAG already exists. Set override_existing only after reviewing the verified replacement APK."
              exit 1
            fi
            echo "Updating existing release assets only after successful build and verification: $TAG"
            gh release upload "$TAG" "$APK" "$SHA" "$CERT" "$BADGING" --clobber
            gh release edit "$TAG" --title "LoganOS v${VERSION_NAME}" --notes "$RELEASE_NOTES" "${EXTRA_ARGS[@]}"
          else
            if [[ "$TAG_EXISTS" == "true" ]]; then
              echo "::error::Tag $TAG exists but release lookup did not return it; refusing to overwrite."
              exit 1
            fi
            gh release create "$TAG" \
              "$APK" "$SHA" "$CERT" "$BADGING" \
              --target "$GITHUB_SHA" \
              --title "LoganOS v${VERSION_NAME}" \
              --notes "$RELEASE_NOTES" \
              "${EXTRA_ARGS[@]}"
          fi
          } 2>&1 | tee -a "$LOG"

      - name: Remove signing key from runner
        if: always()
        id: cleanup
        shell: bash
        run: |
          set +e
          rm -f "${LOGANOS_KEYSTORE_PATH:-}"
          unset LOGANOS_STORE_PASSWORD LOGANOS_KEY_ALIAS LOGANOS_KEY_PASSWORD LOGANOS_KEYSTORE_BASE64
          exit 0

      - name: Redact known signing secrets from diagnostics
        if: always()
        id: redact
        shell: bash
        env:
          LOGANOS_KEYSTORE_BASE64: ${{ secrets.LOGANOS_KEYSTORE_BASE64 }}
          LOGANOS_STORE_PASSWORD: ${{ secrets.LOGANOS_STORE_PASSWORD }}
          LOGANOS_KEY_ALIAS: ${{ secrets.LOGANOS_KEY_ALIAS }}
          LOGANOS_KEY_PASSWORD: ${{ secrets.LOGANOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/loganos-gradle-output.txt"
          MARKER="$RUNNER_TEMP/loganos-redaction-failed"
          rm -f "$MARKER"
          if [[ ! -f "$LOG" ]]; then
            exit 0
          fi
          if ! python3 - <<'PY'
          import os
          from pathlib import Path

          log_path = Path(os.environ["RUNNER_TEMP"]) / "loganos-gradle-output.txt"
          content = log_path.read_text(encoding="utf-8", errors="replace")
          for key in (
              "LOGANOS_KEYSTORE_BASE64",
              "LOGANOS_STORE_PASSWORD",
              "LOGANOS_KEY_ALIAS",
              "LOGANOS_KEY_PASSWORD",
          ):
              value = os.environ.get(key, "")
              if value:
                  content = content.replace(value, f"[REDACTED:{key}]")
                  content = content.replace(value.replace("\r\n", "\n"), f"[REDACTED:{key}]")
                  content = content.replace(value.replace("\n", "\r\n"), f"[REDACTED:{key}]")
          log_path.write_text(content, encoding="utf-8")
          PY
          then
            rm -f "$LOG" || true
            : > "$MARKER"
            echo "::error::Diagnostics redaction failed; raw log was discarded and will not be uploaded."
            exit 1
          fi

      - name: Create release failure report
        if: always()
        id: report
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PREP_OUTCOME: ${{ steps.prep.outcome }}
          WRAPPER_OUTCOME: ${{ steps.wrapper.outcome }}
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          GRADLE_SETUP_OUTCOME: ${{ steps.gradle_setup.outcome }}
          REDACT_OUTCOME: ${{ steps.redact.outcome }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/LoganOS_Release_Error_Report.txt"
          LOG="$RUNNER_TEMP/loganos-gradle-output.txt"
          {
            echo "LoganOS Secure Release Diagnostic Report"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Job status: $JOB_STATUS"
            echo
            echo "=== Step outcomes ==="
            echo "Checkout: ${CHECKOUT_OUTCOME:-not-run}"
            echo "Set up JDK: ${JAVA_OUTCOME:-not-run}"
            echo "Set up Gradle: ${GRADLE_SETUP_OUTCOME:-not-run}"
            echo "Prepare source: ${PREP_OUTCOME:-not-run}"
            echo "Generate wrapper: ${WRAPPER_OUTCOME:-not-run}"
            echo "Read app version: ${VERSION_OUTCOME:-not-run}"
            echo "Prepare signing: ${SIGNING_OUTCOME:-not-run}"
            echo "Build signed APK: ${BUILD_OUTCOME:-not-run}"
            echo "Collect APK: ${COLLECT_OUTCOME:-not-run}"
            echo "Verify APK: ${VERIFY_OUTCOME:-not-run}"
            echo "Attestation: ${ATTEST_OUTCOME:-not-run}"
            echo "Publish release: ${PUBLISH_OUTCOME:-not-run}"
            echo "Redact diagnostics: ${REDACT_OUTCOME:-not-run}"
            echo
            echo "=== Captured Gradle / workflow diagnostics ==="
            MARKER="$RUNNER_TEMP/loganos-redaction-failed"
            if [[ -f "$MARKER" ]]; then
              echo "Redaction failed. Raw command log was discarded; only this safe step-outcome summary is retained."
            elif [[ "${REDACT_OUTCOME:-}" == "success" && ! -f "$MARKER" && -s "$LOG" ]]; then
              tail -n 300 "$LOG"
            else
              echo "No captured command output, or redacted log is empty. Failure may have occurred before log initialization."
            fi
          } > "${REPORT}.tmp"
          mv -f "${REPORT}.tmp" "$REPORT"
          echo "Diagnostic report created."

      - name: Upload redacted release diagnostics
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: loganos-release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/LoganOS_Release_Error_Report.txt
            ${{ runner.temp }}/loganos-gradle-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload safe summary only (redaction failed)
        if: always() && steps.redact.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: loganos-release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/LoganOS_Release_Error_Report.txt
          if-no-files-found: warn
          retention-days: 14
